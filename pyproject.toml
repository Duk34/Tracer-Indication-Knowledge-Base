[project]
name = "tikb"
version = "0.1.0"
description = "Tracer-Indication-Knowledge-Base"
readme = "README.md"
requires-python = "==3.11.*"     # same as env.yaml: conda-forge has no spacy 3.7 builds for python 3.12
dependencies = [
    "beautifulsoup4==4.15.0",
    "conllu==6.0.0",             # needed by scispacy
    "httpx==0.28.1",
    "numpy==1.26.4",             # scispacy requires numpy<2
    "openpyxl==3.1.5",           # needed by pandas.read_excel
    "pandas==2.3.3",             # snakemake 9.27.1 requires pandas<3
    "pysbd==0.3.4",              # needed by scispacy
    "scikit-learn==1.9.1",       # needed by scispacy
    "scipy==1.17.1",             # needed by scispacy
    "snakemake==9.27.1",
    "spacy==3.7.6",              # en_ner_bc5cdr_md 0.5.4 is bound to spacy 3.7.x
                                 # yanked on PyPI (only affects transformer models), uv warns about it
    "scispacy==0.6.2",
    "en_ner_bc5cdr_md @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_ner_bc5cdr_md-0.5.4.tar.gz#sha256=ffc73130a710edf851206199720cb2c744a043e032f5da6ba4bb36863deca778",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "snakefmt==2.1.0",
]

[tool.uv]
package = false                  # scripts only, nothing to build or install
